<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#131315">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #131315; overflow: hidden; touch-action: none; }
      body { font: 500 13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #ECE6DA; letter-spacing: 0.08em; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #131315; outline: none; }
      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #131315; }
      .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; }
      .brand span { color: #E3A23B; }
      .caption { color: #8E8A82; font-size: 11px; text-transform: uppercase; }
      .track { width: min(320px, 60vw); height: 3px; background: #34353A; }
      .fill { width: 0; height: 100%; background: #E3A23B; transition: width 0.15s linear; }
      #rotate { display: none; z-index: 2; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loader" class="overlay">
      <div class="brand">ATELIER <span>01</span></div>
      <div class="track"><div id="fill" class="fill"></div></div>
      <div id="status" class="caption">Loading studio</div>
    </div>

    <div id="rotate" class="overlay">
      <div class="brand">ATELIER <span>01</span></div>
      <div class="caption">Turn your phone sideways</div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const loader = document.getElementById("loader");
      const fill = document.getElementById("fill");
      const status = document.getElementById("status");

      createUnityInstance(document.getElementById("unity-canvas"), {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Phones report 3x density; rendering above 2x costs frame rate with no visible gain.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, (progress) => {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        loader.remove();
      }).catch((message) => {
        status.textContent = message;
        status.style.color = "#C8553D";
      });
    </script>
  </body>
</html>
